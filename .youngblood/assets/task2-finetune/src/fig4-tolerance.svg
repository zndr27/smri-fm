3 places the boundary can land are inside the 1mm band</text><text x="24" y="160" font-size="12.5" fill="#1f2328" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">through plane, a slice edge every 6mm</text><rect x="340.0" y="174" width="30.0" height="40" fill="#0d7c8b" opacity="0.20"/><line x1="40.0" y1="174" x2="40.0" y2="214" stroke="#c9cfd6" stroke-width="1.0"/><line x1="130.0" y1="174" x2="130.0" y2="214" stroke="#c9cfd6" stroke-width="1.0"/><line x1="220.0" y1="174" x2="220.0" y2="214" stroke="#c9cfd6" stroke-width="1.0"/><line x1="310.0" y1="174" x2="310.0" y2="214" stroke="#c9cfd6" stroke-width="1.0"/><line x1="400.0" y1="174" x2="400.0" y2="214" stroke="#c9cfd6" stroke-width="1.0"/><line x1="490.0" y1="174" x2="490.0" y2="214" stroke="#c9cfd6" stroke-width="1.0"/><line x1="580.0" y1="174" x2="580.0" y2="214" stroke="#c9cfd6" stroke-width="1.0"/><line x1="355.0" y1="168" x2="355.0" y2="220" stroke="#bb3d78" stroke-width="2.6"/><text x="24" y="240" font-size="12" fill="#9d6a0d" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">0 places inside the band. The nearest is 3mm out, three times the tolerance.</text><line x1="24" y1="264" x2="676" y2="264" stroke="#c9cfd6" stroke-width="1"/><text x="24" y="286" font-size="11.5" fill="#5b6470" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Pink is the true boundary. The teal band is the 1mm tolerance around it. Each</text><text x="24" y="302" font-size="11.5" fill="#5b6470" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">tick is a place a voxel boundary can actually sit. Green ticks score, grey ones do not.</text><text x="24" y="324" font-size="12" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Nothing about the head moves the bottom row. That is the acquisition.</text></svg>