[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "smri-fm"
dynamic = ["version"]
description = "MedARC sMRI foundation model"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "braceexpand",
    "datasets",
    "einops",
    "huggingface-hub",
    "ipython",
    "jaxtyping",
    "jupyter",
    "matplotlib",
    "nibabel",
    "numpy",
    "omegaconf",
    "pandas",
    "pre-commit",
    "pytest",
    "pyyaml",
    "s3fs",
    "scikit-learn",
    "scipy",
    "seaborn",
    # the pypi build is a pre-numpy-2 snapshot and raises on an empty mask
    "surface-distance @ git+https://github.com/google-deepmind/surface-distance",
    "tabulate",
    "templateflow",
    "timm",
    "torch==2.8.0",
    "torchvision",
    "tqdm",
    "wandb",
    "webdataset",
]


[tool.setuptools_scm]
version_file = "src/_version.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F722"]

[tool.pytest.ini_options]
norecursedirs = ["third_party", ".scratch"]
